    ocp_version: 4.20+
    topology: cloud-vms-base
    showroom_type: classic
  learning_objectives:
  - Register remote edge devices with Ansible Automation Platform using dynamic inventory
    and device credentials
  - Deploy fleet-wide configuration changes to RHEL for Edge devices using AAP job
    templates and inventory groups
  - Execute rolling application updates across an edge device fleet using Ansible
    playbooks and AAP workflows
  - Detect and automatically remediate a security finding on edge devices using Event-Driven
    Ansible rulebooks
